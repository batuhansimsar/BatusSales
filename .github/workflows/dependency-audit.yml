name: Dependency security audit

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Weekly refresh catches newly published package advisories.
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nuget-audit:
    name: NuGet direct and transitive vulnerabilities
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up .NET 10 LTS
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      # net10.0 audits transitive dependencies, too. Moderate/High/Critical
      # advisories fail the job instead of appearing as ignorable NU1902-4 warnings.
      # Keep both test projects: their package graphs are not identical.
      - name: Audit API and unit-test dependencies
        run: >
          dotnet restore tests/BatusSales.Api.Tests/BatusSales.Api.Tests.csproj
          -p:NuGetAudit=true
          -p:NuGetAuditMode=all
          -p:NuGetAuditLevel=moderate
          -p:TreatWarningsAsErrors=true

      - name: Audit HTTP integration-test dependencies
        run: >
          dotnet restore tests/BatusSales.Api.IntegrationTests/BatusSales.Api.IntegrationTests.csproj
          -p:NuGetAudit=true
          -p:NuGetAuditMode=all
          -p:NuGetAuditLevel=moderate
          -p:TreatWarningsAsErrors=true
