name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  api:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: batussales_test
          POSTGRES_PASSWORD: ci_test_password_only
          POSTGRES_DB: batussales_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U batussales_test -d batussales_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      # Disposable service database; never use production credentials.
      BATUSSALES_TEST_POSTGRES: "Host=127.0.0.1;Port=5432;Database=batussales_test;Username=batussales_test;Password=ci_test_password_only"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build API
        run: dotnet build src/BatusSales.Api/BatusSales.Api.csproj --configuration Release
      - name: Require PostgreSQL test configuration
        run: test -n "$BATUSSALES_TEST_POSTGRES"
      - name: Run unit and PostgreSQL integration tests
        run: dotnet test tests/BatusSales.Api.Tests/BatusSales.Api.Tests.csproj --configuration Release
      - name: Smoke-test API boot and Identity register/login against PostgreSQL
        env:
          ASPNETCORE_ENVIRONMENT: Development
          ASPNETCORE_URLS: http://127.0.0.1:18080
          ConnectionStrings__Postgres: "Host=127.0.0.1;Port=5432;Database=batussales_test;Username=batussales_test;Password=ci_test_password_only"
          BATUSSALES_DEV_CREATE_DB: "true"
        shell: bash
        run: |
          set -euo pipefail
          dotnet run --no-build --configuration Release --project src/BatusSales.Api/BatusSales.Api.csproj > "$RUNNER_TEMP/batussales-api.log" 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          ready=false
          for i in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:18080/health > /dev/null; then
              ready=true
              break
            fi
            if ! kill -0 "$pid" 2>/dev/null; then
              cat "$RUNNER_TEMP/batussales-api.log"
              exit 1
            fi
            sleep 1
          done
          if [ "$ready" != true ]; then
            cat "$RUNNER_TEMP/batussales-api.log"
            exit 1
          fi
          curl --fail --silent --show-error \
            -H 'Content-Type: application/json' \
            -d '{"email":"ci-smoke@example.test","password":"T3st!PassW0rd888"}' \
            http://127.0.0.1:18080/auth/register > /dev/null
          curl --fail --silent --show-error \
            -H 'Content-Type: application/json' \
            -d '{"email":"ci-smoke@example.test","password":"T3st!PassW0rd888"}' \
            http://127.0.0.1:18080/auth/login > /dev/null
