name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore tests/BatusSales.Api.Tests/BatusSales.Api.Tests.csproj
      - name: Build
        run: dotnet build tests/BatusSales.Api.Tests/BatusSales.Api.Tests.csproj --no-restore --configuration Release
      - name: Test
        run: dotnet test tests/BatusSales.Api.Tests/BatusSales.Api.Tests.csproj --no-build --configuration Release

  postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: batussales_test
          POSTGRES_PASSWORD: isolated-ci-test-password
          POSTGRES_DB: batussales_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U batussales_test -d batussales_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      BATUSSALES_TEST_POSTGRES: Host=localhost;Port=5432;Database=batussales_test;Username=batussales_test;Password=isolated-ci-test-password
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Restore integration tests
        run: dotnet restore tests/BatusSales.Api.IntegrationTests/BatusSales.Api.IntegrationTests.csproj
      - name: Run PostgreSQL HTTP integration tests
        run: dotnet test tests/BatusSales.Api.IntegrationTests/BatusSales.Api.IntegrationTests.csproj --configuration Release --no-restore
