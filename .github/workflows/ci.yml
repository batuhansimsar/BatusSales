name: CI

on:
  push:
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore tests/BatuSales.Api.Tests/BatuSales.Api.Tests.csproj
      - name: Build
        run: dotnet build tests/BatuSales.Api.Tests/BatuSales.Api.Tests.csproj --no-restore -c Release
      - name: Test
        run: dotnet test tests/BatuSales.Api.Tests/BatuSales.Api.Tests.csproj --no-build -c Release --verbosity normal

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Audit production dependencies (high/critical)
        run: npm audit --omit=dev --audit-level=high
      - run: npm run build
      - run: npm run typecheck
