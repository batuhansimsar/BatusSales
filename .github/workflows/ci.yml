name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  api:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build API
        run: dotnet build src/BatusSales.Api/BatusSales.Api.csproj --configuration Release
      - name: Run unit tests
        run: dotnet test tests/BatusSales.Api.Tests/BatusSales.Api.Tests.csproj --configuration Release

  postgres-integration:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: batussales_ci
          POSTGRES_USER: batussales_ci
          POSTGRES_PASSWORD: ephemeral-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U batussales_ci -d batussales_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      # Temporary credentials for GitHub's disposable service container only.
      BATUSSALES_TEST_POSTGRES: Host=localhost;Port=5432;Database=batussales_ci;Username=batussales_ci;Password=ephemeral-ci-only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Run PostgreSQL tenant-isolation integration tests
        run: dotnet test tests/BatusSales.Postgres.Tests/BatusSales.Postgres.Tests.csproj --configuration Release
