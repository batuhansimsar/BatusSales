name: API CI

on:
  push:
    paths:
      - "src/**"
      - "tests/**"
      - ".github/workflows/api-ci.yml"
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - ".github/workflows/api-ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Restore and build API
        run: dotnet build src/BatusSales.Api/BatusSales.Api.csproj -c Release
      - name: Run xUnit v3 tests
        run: dotnet run --project tests/BatusSales.Api.Tests/BatusSales.Api.Tests.csproj -c Release
