name: API build and unit tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore tests/BatuSales.Tests/BatuSales.Tests.csproj
      - name: Build
        run: dotnet build tests/BatuSales.Tests/BatuSales.Tests.csproj --configuration Release --no-restore
      - name: Unit tests
        run: dotnet test tests/BatuSales.Tests/BatuSales.Tests.csproj --configuration Release --no-build
